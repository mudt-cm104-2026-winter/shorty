name: Feature
description: New feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [Backend, Frontend, Database, Analytics]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What & why?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: "- [ ] ..."
