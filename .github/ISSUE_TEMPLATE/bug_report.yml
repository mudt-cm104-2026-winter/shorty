name: Bug
description: Something is broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Backend, Frontend, Database, Analytics]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      description: Steps, expected vs. actual, logs
    validations:
      required: true
