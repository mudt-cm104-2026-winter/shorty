<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shorty</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body>
    <main>
      <h1>Shorty</h1>
      <p class="intro">
        Paste a long URL and shorty turns it into a short link.
      </p>

      <form class="add" action="/add" method="post">
        <input
          name="thing"
          placeholder="What?"
          required
          autocomplete="off"
          autofocus
        />
        <input name="person" placeholder="Who?" required autocomplete="off" />
        <button type="submit">Add</button>
      </form>

      {% if entries %}
      <table>
        <thead>
          <tr>
            <th>What</th>
            <th>Who</th>
          </tr>
        </thead>
        <tbody>
          {% for entry in entries %}
          <tr>
            <td>{{ entry.url }}</td>
            <td>{{ entry.short }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <p class="empty">No links yet.</p>
      {% endif %}
    </main>
  </body>
</html>
