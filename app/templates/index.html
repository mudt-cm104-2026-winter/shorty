<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shorty</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body>
    <main>
      <h1>Shorty</h1>
      <p class="intro">
        Paste a long URL and shorty turns it into a short link.
      </p>

      <form class="add" action="/add" method="post">
        <input
          name="url"
          placeholder="paste your long link here"
          value="{{ value or '' }}"
          required
          autocomplete="off"
          autofocus
        />
        <button type="submit">Shorten</button>
      </form>

      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %} {% if entries %}
      <table>
        <thead>
          <tr>
            <th>Original link</th>
            <th>Short link</th>
          </tr>
        </thead>
        <tbody>
          {% for entry in entries %}
          <tr>
            <td>{{ entry.url }}</td>
            <td>
              <a href="/short/{{ entry.short }}"
                >{{ request.base_url }}short/{{ entry.short }}</a
              >
            </td>
            <td>
              <button
                type="button"
                class="copy"
                onclick="copyLink(this, '{{ entry.short }}')"
              >
                Copy
              </button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <p class="empty">No links yet.</p>
      {% endif %}
    </main>
    <script>
      function copyLink(button, short) {
        var link = window.location.origin + '/short/' + short;

        navigator.clipboard.writeText(link);

        button.textContent = 'Copied!';
        setTimeout(function () {
          button.textContent = 'Copy';
        }, 2000);
      }
    </script>
  </body>
</html>
